spring:
  application:
    name: config-server
  profiles:
    active: git
  cloud:
    config:
      server:
        git:
          uri: ${GIT_URL}
          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: true
          username: PratapShishodia
          password: ${GIT_TOKEN}
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: "*"